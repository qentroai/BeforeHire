<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statute — Sign in</title>

<style>
body {
  font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f9f9f7;
  margin:0;
  color:#111;
}

.wrap {
  max-width:620px;
  margin:70px auto;
  padding:20px;
}

.brand {
  font-weight:800;
  letter-spacing:.03em;
  margin-bottom:8px;
}

.card {
  background:#fff;
  border:1px solid #e1e0d9;
  border-radius:14px;
  padding:24px;
}

.tabs {
  display:flex;
  gap:6px;
  margin-bottom:18px;
}

button {
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font-weight:700;
  cursor:pointer;
  background:#2a78d6;
  color:#fff;
}

button.alt {
  background:#f2f2ef;
  color:#333;
}

button.active {
  background:#2a78d6;
  color:#fff;
}

label {
  display:block;
  font-size:12px;
  font-weight:700;
  color:#555;
  margin:12px 0 6px;
}

input {
  width:100%;
  box-sizing:border-box;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

.msg {
  margin-top:12px;
  font-size:13px;
}

.muted {
  font-size:12px;
  color:#777;
}

.hidden {
  display:none;
}

.error {
  color:#c83c3c;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    STATUTE
    <span class="muted">Before You Hire</span>
  </div>

  <div class="card">

    <div class="tabs">
      <button id="signupTab" class="active">Create account</button>
      <button id="loginTab" class="alt">Sign in</button>
    </div>

    <div id="signupPanel">

      <label>Name</label>
      <input id="signupName">

      <label>Email</label>
      <input id="signupEmail" type="email">

      <label>Company name</label>
      <input id="signupCompany">

      <label>Password</label>
      <input
        id="signupPassword"
        type="password"
        minlength="8"
        placeholder="At least 8 characters"
      >

      <p class="muted">
        We'll send an email to verify your account.
      </p>

      <button id="signupBtn">Create account</button>

      <div id="signupMsg" class="msg"></div>

    </div>

    <div id="loginPanel" class="hidden">

      <label>Email</label>
      <input id="loginEmail" type="email">

      <label>Password</label>
      <input id="loginPassword" type="password">

      <button id="loginBtn">Sign in</button>

      <div id="loginMsg" class="msg"></div>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const cfg = window.STATUTE_CONFIG;

const sb = supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_PUBLISHABLE_KEY
);

const signupTab = document.getElementById("signupTab");
const loginTab = document.getElementById("loginTab");
const signupPanel = document.getElementById("signupPanel");
const loginPanel = document.getElementById("loginPanel");

signupTab.onclick = () => {
  signupPanel.classList.remove("hidden");
  loginPanel.classList.add("hidden");

  signupTab.classList.add("active");
  signupTab.classList.remove("alt");

  loginTab.classList.remove("active");
  loginTab.classList.add("alt");
};

loginTab.onclick = () => {
  loginPanel.classList.remove("hidden");
  signupPanel.classList.add("hidden");

  loginTab.classList.add("active");
  loginTab.classList.remove("alt");

  signupTab.classList.remove("active");
  signupTab.classList.add("alt");
};


/* CREATE ACCOUNT */

document.getElementById("signupBtn").onclick = async () => {

  const msg = document.getElementById("signupMsg");

  msg.textContent = "Creating account...";
  msg.className = "msg";

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const company =
    document.getElementById("signupCompany").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if (name.length < 2) {
    msg.textContent = "Please enter your name.";
    msg.className = "msg error";
    return;
  }

  if (company.length < 2) {
    msg.textContent = "Please enter your company name.";
    msg.className = "msg error";
    return;
  }

  if (!email) {
    msg.textContent = "Please enter your email.";
    msg.className = "msg error";
    return;
  }

  if (password.length < 8) {
    msg.textContent =
      "Password must contain at least 8 characters.";
    msg.className = "msg error";
    return;
  }

  const { data, error } = await sb.auth.signUp({
    email: email,
    password: password,

    options: {
      emailRedirectTo:
        "https://beforeyouhire.qentrotech.com/index.html",

      data: {
        full_name: name,
        company_name: company
      }
    }
  });

  if (error) {
    msg.textContent = error.message;
    msg.className = "msg error";
    return;
  }

  if (data.session) {
    window.location.href = "index.html";
  } else {
    msg.textContent =
      "Account created. Please check your email to verify your account.";
  }
};


/* SIGN IN */

document.getElementById("loginBtn").onclick = async () => {

  const msg = document.getElementById("loginMsg");

  msg.textContent = "Signing in...";
  msg.className = "msg";

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!email || !password) {
    msg.textContent =
      "Please enter your email and password.";
    msg.className = "msg error";
    return;
  }

  const { data, error } =
    await sb.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    msg.textContent = error.message;
    msg.className = "msg error";
    return;
  }

  window.location.href = "index.html";
};


/* ALREADY SIGNED IN */

sb.auth.getSession().then(({ data: { session } }) => {

  if (session) {
    window.location.href = "index.html";
  }

});
</script>

</body>
</html>
