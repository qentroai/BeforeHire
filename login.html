<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statute — Sign in</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f9f9f7;margin:0;color:#111}.wrap{max-width:620px;margin:70px auto;padding:20px}.brand{font-weight:800;letter-spacing:.03em;margin-bottom:8px}.card{background:#fff;border:1px solid #e1e0d9;border-radius:14px;padding:24px}.tabs{display:flex;gap:6px;margin-bottom:18px}button{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;background:#2a78d6;color:#fff}button.alt{background:#f2f2ef;color:#333}.active{background:#2a78d6!important;color:#fff!important}label{display:block;font-size:12px;font-weight:700;color:#555;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}.msg{margin-top:12px;font-size:13px}.muted{font-size:12px;color:#777}.hidden{display:none}.error{color:#c83c3c}</style></head><body>
<div class="wrap"><div class="brand">STATUTE <span class="muted">Before You Hire</span></div><div class="card">
<div class="tabs"><button id="signupTab" class="active">Create account</button><button id="loginTab" class="alt">Sign in</button></div>
<div id="signupPanel"><label>Name</label><input id="signupName"><label>Email</label><input id="signupEmail" type="email"><label>Company name</label><input id="signupCompany"><p class="muted">We'll send a passwordless email link.</p><button id="signupBtn">Create account</button><div id="signupMsg" class="msg"></div></div>
<div id="loginPanel" class="hidden"><label>Email</label><input id="loginEmail" type="email"><p class="muted">We'll send a passwordless sign-in link.</p><button id="loginBtn">Send sign-in email</button><div id="loginMsg" class="msg"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.STATUTE_CONFIG,sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
signupTab.onclick=()=>{signupPanel.classList.remove("hidden");loginPanel.classList.add("hidden");signupTab.classList.add("active");loginTab.classList.remove("active")}
loginTab.onclick=()=>{loginPanel.classList.remove("hidden");signupPanel.classList.add("hidden");loginTab.classList.add("active");signupTab.classList.remove("active")}
signupBtn.onclick=async()=>{signupMsg.textContent="Sending...";const {error}=await sb.auth.signInWithOtp({email:signupEmail.value.trim(),options:{shouldCreateUser:true,emailRedirectTo:new URL("index.html",location.href).href,data:{full_name:signupName.value.trim(),company_name:signupCompany.value.trim()}}});signupMsg.textContent=error?error.message:"Check your email to finish signup.";signupMsg.className=error?"msg error":"msg"}
loginBtn.onclick=async()=>{loginMsg.textContent="Sending...";const {error}=await sb.auth.signInWithOtp({email:loginEmail.value.trim(),options:{shouldCreateUser:false,emailRedirectTo:new URL("index.html",location.href).href}});loginMsg.textContent=error?error.message:"Check your email to sign in.";loginMsg.className=error?"msg error":"msg"}
sb.auth.getSession().then(({data:{session}})=>{if(session)location.href="index.html"})
</script></body></html>
